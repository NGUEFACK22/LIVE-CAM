# ---------------------------------------------------------------------
# ACL pour restreindre l'accès selon le rôle
# ---------------------------------------------------------------------
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

# ---------------------------------------------------------------------
# Plugins globaux
# ---------------------------------------------------------------------
plugins:
  # Rate limiting global (optionnel)
  - name: rate-limiting
    config:
      minute: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # Request size limit
  - name: request-size-limiting
    config:
      allowed_payload_size: 128
      require_content_length: false