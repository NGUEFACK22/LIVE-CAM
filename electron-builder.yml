# Configuration electron-builder pour ChapCam Desktop
# Empaquete l'app + le pilote de camera virtuelle "ChapCam Camera".
appId: com.chapcam.desktop
productName: ChapCam
copyright: Copyright (c) ChapCam

directories:
  output: dist
  buildResources: electron/build

# Fichiers de l'app embarques dans l'asar
files:
  - electron/**/*
  - .next/**/*
  - public/**/*
  - package.json
  - .env.local

# CRITIQUE : `next start` a besoin d'un dossier REEL en cwd (il lit/ecrit
# node_modules, caches et .next). L'asar est un fichier : `next start` y
# echoue et l'app affiche une erreur "processus principal". On de-paquete
# donc node_modules, .next, public ET .env.local hors asar (dans
# app.asar.unpacked) et on pointe le serveur Next vers ce dossier reel.
# .env.local est lu par `next start` au demarrage (DECART_API_KEY et cie).
# S'il restait dans l'asar, le process Next (ELECTRON_RUN_AS_NODE = node
# pur, sans support asar) ne pourrait pas le lire et le swap IA echouerait.
asarUnpack:
  - "node_modules/**/*"
  - ".next/**/*"
  - "public/**/*"
  - ".env.local"

# Le pilote akvirtualcamera est copie HORS de l'asar (binaires natifs a executer).
# Depose les binaires dans resources/akvirtualcamera/{x64,x86}/ avant le build
# (voir electron/build/README-driver.md).
extraResources:
  - from: resources/akvirtualcamera
    to: akvirtualcamera
    filter:
      - "**/*"

# L'icone est auto-detectee depuis buildResources (electron/build/icon.png),
# electron-builder genere .ico/.icns automatiquement.
win:
  target:
    - nsis
  # Installer le pilote = privileges administrateur obligatoires
  requestedExecutionLevel: requireAdministrator
  artifactName: ChapCam-Setup-${version}.${ext}
  # Pas de certificat de signature : evite le telechargement/zip winCodeSign
  # qui echoue sur les symlinks sans privileges admin (machine de dev).
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: true # pilote systeme -> installation pour toute la machine
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChapCam
  # Hooks personnalises : (de)sinstallation du pilote camera
  include: electron/build/installer.nsh

mac:
  target:
    - dmg
  category: public.app-category.video

linux:
  target:
    - AppImage
  category: Video
